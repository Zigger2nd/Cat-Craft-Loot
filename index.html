<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cat Clicker</title>

    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <button type="button" id="openSkinsBtn" class="skins-button">
      MY SKINS
    </button>
    <section class="game">
      <div class="main">
        <div class="left">
          <h3>
            Treats:
            <span class="treats-count">0</span>
          </h3>

          <div class="cat-container">
            <div class="sprite" id="clickBtn"></div>
          </div>

          <p>
            Treats per click:
            <span class="click-power">1</span>
          </p>
        </div>
        <div class="right">
          <div class="upgrade">
            <div class="left-section">
              <img src="/skins/click.png" alt="Clicker" class="clicker-img" />
            </div>

            <div class="mid-section">
              <h4>
                Clicker

                <div class="cost-info">
                  <p>
                    Cost:
                    <span class="clicker-cost">10</span>
                  </p>

                  <img src="/skins/food.png" alt="Treats" class="food-img" />
                </div>
              </h4>
            </div>

            <div class="right-section">
              Level
              <span class="click-level">0</span>
            </div>

            <div class="next-level-info">
              <p>
                +<span class="click-power">1</span> food
                <br />
                per click
              </p>
            </div>

            <button type="button" id="buyClickBtn" class="upgrade-button">
              Buy upgrade
            </button>
          </div>

          <div class="generator-section">
            <h3>Cat generators</h3>

            <div id="generatorList"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="skinsModal" class="skins-modal" aria-hidden="true">
      <div
        class="skins-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="skinsModalTitle"
      >
        <div class="skins-modal-header">
          <h2 id="skinsModalTitle">My Skins</h2>

          <button
            type="button"
            id="closeSkinsBtn"
            class="close-skins-btn"
            aria-label="Close skins"
          >
            &times;
          </button>
        </div>

        <div class="skin-rarity-filters">
          <button
            type="button"
            class="rarity-button active"
            data-rarity="common"
          >
            Common
          </button>

          <button type="button" class="rarity-button" data-rarity="rare">
            Rare
          </button>

          <button type="button" class="rarity-button" data-rarity="epic">
            Epic
          </button>

          <button type="button" class="rarity-button" data-rarity="legendary">
            Legendary
          </button>
        </div>

        <div id="ownedSkinsList" class="owned-skins-list"></div>
      </div>
    </div>

    <button id="boxBtn">OPEN BOX</button>

    <dialog id="dialog" class="lootbox-modal">
      <div class="lootbox-modal-content">
        <div class="lootbox-modal-header">
          <div class="lootbox-header-info">
            <h2>Open a Loot Box</h2>

            <div class="energy-ad-row">
              <div class="energy-display">
                <div
                  class="energy-bar"
                  role="progressbar"
                  aria-label="Energy"
                  aria-valuemin="0"
                  aria-valuemax="10"
                  aria-valuenow="10"
                ></div>
              </div>
              <span class="energy-count">10 / 10</span>

              <button type="button" class="watch-ad-btn">Watch AD</button>
            </div>
          </div>

          <button
            id="closeBtn"
            class="close-lootbox-btn"
            aria-label="Close loot box"
          >
            &times;
          </button>
        </div>

        <div class="lootbox-container">
          <div class="lootbox-line"></div>
          <div class="lootbox-ribbon"></div>
        </div>

        <button id="openBoxBtn" class="open-lootbox-btn">OPEN BOX</button>

        <p class="dust-display">
          Dust: <span class="dust-count">0</span>
          <img src="/skins/dust.png" alt="Dust" class="dust-icon" />
        </p>

        <p id="lootResult"></p>
      </div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
