<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cat Clicker</title>

    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body>
    <section class="game">
      <div class="main">
        <div class="left">
          <h3>
            Treats:
            <span class="treats-count">0</span>
          </h3>

          <div class="cat-container">
            <div class="sprite" id="clickBtn"></div>
          </div>

          <p>
            Treats per click:
            <span class="click-power">1</span>
          </p>
        </div>
        <div class="right">
          <div class="upgrade">
            <div class="left-section">
              <img src="/skins/click.png" alt="Clicker" class="clicker-img" />
            </div>

            <div class="mid-section">
              <h4>
                Clicker

                <div class="cost-info">
                  <p>
                    Cost:
                    <span class="clicker-cost">10</span>
                  </p>

                  <img
                    src="./public/skins/food.png"
                    alt="Treats"
                    class="food-img"
                  />
                </div>
              </h4>
            </div>

            <div class="right-section">
              Level
              <span class="click-level">0</span>
            </div>

            <div class="next-level-info">
              <p>
                +<span class="click-power">1</span> food
                <br />
                per click
              </p>
            </div>

            <button type="button" id="buyClickBtn" class="upgrade-button">
              Buy upgrade
            </button>
          </div>

          <div class="generator-section">
            <h3>Cat generators</h3>

            <div id="generatorList"></div>
          </div>
        </div>
      </div>
    </section>

    <span class="energy-count">0</span> energy amount <br />

    <span class="dust-count">0</span> dust amount <br />
    <p id="lootResult"></p>
    <div id="catCardList"></div>
    <button id="boxBtn">OPEN BOX</button>
    <dialog id="dialog">
      <button id="openBoxBtn">OPEN BOX</button>
      <button id="closeBtn">CLOSE BOX</button>
      <div class="lootbox-container">
        <div class="lootbox-line"></div>
        <div class="lootbox-ribbon"></div>
      </div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
